[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gqteashmd"
version = "0.1.0.dev0"
description = "Automated surface-hopping molecular dynamics workflow (PySCF backend)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "numpy>=1.26", "pyscf>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3"]

[project.scripts]
gqteashmd = "gqteashmd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gqteashmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -p no:cacheprovider"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # ruff >=0.17 formats markdown code blocks; keep docs as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pyscf", "pyscf.*"]
ignore_missing_imports = true
