name: gqteashmd-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pydantic>=2.6
  - pytest>=8
  - ruff=0.17.4  # same version as the pre-commit hook
  - mypy=1.*
  - pre-commit>=3
  # needed from P3 on; installed now so the environment does not change shape later
  - pyscf=2.14.*
  - numpy
  - scipy
  - h5py
  - geometric
